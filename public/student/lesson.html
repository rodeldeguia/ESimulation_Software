<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson — SSEGL</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: block; padding: 40px 20px; }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 40px;
    }
    .container h1 { color: #1e3a8a; margin-bottom: 8px; }
    .container .meta { color: #64748b; font-size: 13px; margin-bottom: 24px; }
    .content { line-height: 1.7; color: #0f172a; }
    .back { display: inline-block; color: #1e3a8a; text-decoration: none; margin-bottom: 20px; }

        /* Lesson content styling */
    .content h1 { color: #2c3e50; border-bottom: 3px solid #4CAF50; padding-bottom: 10px; margin-top: 30px; }
    .content h2 { color: #34495e; margin-top: 30px; border-left: 4px solid #4CAF50; padding-left: 15px; }
    .content h3 { color: #555; margin-top: 25px; }

    .content .info-box-blue {
      background: #e3f2fd; border-left: 6px solid #2196F3;
      padding: 20px; margin: 25px 0; border-radius: 8px;
    }
    .content .info-box-blue h3 { color: #1976D2; margin-top: 0; }
    .content .btn-blue {
      display: inline-block; background: #2196F3; color: white !important;
      padding: 10px 20px; text-decoration: none; border-radius: 5px;
      font-weight: bold; margin-top: 10px;
    }

    .content .tip-box-green {
      background: #e8f5e9; border-left: 6px solid #4CAF50;
      padding: 20px; margin: 25px 0; border-radius: 8px;
    }
    .content .tip-box-green h3 { color: #2E7D32; margin-top: 0; }

    .content .warning-box-yellow {
      background: #fff3e0; border-left: 6px solid #FF9800;
      padding: 20px; margin: 25px 0; border-radius: 8px;
    }
    .content .warning-box-yellow h3 { color: #E65100; margin-top: 0; }

    .content .important-box-red {
      background: #ffebee; border-left: 6px solid #f44336;
      padding: 20px; margin: 25px 0; border-radius: 8px;
    }
    .content .important-box-red h3 { color: #c62828; margin-top: 0; }

    .content .grammar-example {
      background: linear-gradient(135deg, #667eea 10%, #764ba2 100%);
      color: white; padding: 25px; margin: 25px 0; border-radius: 10px;
    }
    .content .grammar-example h3 {
      color: white; margin-top: 0; border-bottom: 2px solid white;
      display: inline-block; padding-bottom: 5px;
    }
    .content .grammar-example strong { color: #FFD700; }
    .content .grammar-example .explanation {
      background: rgba(255,255,255,0.2); padding: 10px;
      border-radius: 5px; margin-top: 15px; font-style: italic;
    }

    .content pre {
      background: #1e1e1e; color: #d4d4d4; padding: 15px;
      border-left: 4px solid #4CAF50; border-radius: 5px; overflow-x: auto;
    }
    .content code {
      background: #f4f4f4; padding: 2px 5px; border-radius: 3px;
      font-family: monospace;
    }
    .content pre code { background: transparent; color: inherit; }

    .content table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    .content th, .content td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    .content th { background: #4CAF50; color: white; }
  </style>
</head>
<body>

  <div class="container">
    <a class="back" href="/student/lessons.html">← Back to Lessons</a>
    <div id="lessonContent">Loading...</div>
  </div>

  <script src="/student/lesson.js"></script>
</body>
</html>
