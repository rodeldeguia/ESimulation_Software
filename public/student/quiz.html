<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — SSEGL</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: block; padding: 40px 20px; }
    .quiz-container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 40px;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    .quiz-header h1 { color: #1e3a8a; font-size: 20px; }
    .timer {
      background: #fee2e2;
      color: #991b1b;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
    }
    .timer.warning { background: #fef3c7; color: #92400e; }
    .question-counter {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .question-text {
      font-size: 18px;
      color: #0f172a;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .options { list-style: none; }
    .option {
      display: block;
      padding: 12px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border 0.15s, background 0.15s;
    }
    .option:hover { border-color: #1e3a8a; background: #f0f4ff; }
    .option.selected { border-color: #1e3a8a; background: #dbeafe; }
    .option input { display: none; }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
    }
    .nav-buttons button { width: auto; padding: 10px 24px; }
    .nav-buttons button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary { background: #94a3b8; }
    .btn-secondary:hover { background: #64748b; }
    .result-card {
      text-align: center;
    }
    .result-score {
      font-size: 56px;
      font-weight: 800;
      margin: 16px 0;
    }
    .result-score.pass { color: #166534; }
    .result-score.fail { color: #991b1b; }
    .result-breakdown { text-align: left; margin-top: 32px; }
    .result-item {
      border-left: 4px solid #ccc;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 4px;
    }
    .result-item.correct { border-color: #16a34a; background: #f0fdf4; }
    .result-item.wrong   { border-color: #dc2626; background: #fef2f2; }
    .result-item h4 { font-size: 14px; margin-bottom: 8px; color: #0f172a; }
    .result-item p { font-size: 13px; color: #475569; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="quiz-container" id="app">
    Loading...
  </div>

  <script src="/student/quiz.js"></script>
</body>
</html>
