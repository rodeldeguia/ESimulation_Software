<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Sign Up — SSEGL</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="card">
    <h1>Student Sign Up</h1>
    <h2>Create your account to start learning</h2>

    <form id="signupForm">
        
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" required placeholder="e.g. John Doe">
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6">
      </div>

      <div class="form-group">
        <label for="grade_level">Grade Level</label>
        <select id="grade_level" required>
          <option value="">Select grade </option>
          <option value="7">Grade 7</option>
          <option value="8">Grade 8</option>
          <option value="9">Grade 9</option>
          <option value="10">Grade 10</option>
        </select>
      </div>

      <div class="form-group">
        <label for="birth_date">Birth Date (optional)</label>
        <input type="date" id="birth_date">
      </div>

      <div class="form-group">
        <label for="LRN">LRN (optional)</label>
        <input type="text" id="LRN">
      </div>

      <button type="submit" id="submitBtn">Sign Up</button>
    </form>

    <div id="message" class="message"></div>

    <div class="link">
      Already have an account? <a href="/auth/student-login.html">Log in</a>
    </div>
    <div class="link">
      Are you a teacher? <a href="/auth/teacher-signup.html">Sign up as Teacher</a>
    </div>
  </div>

  <script src="/auth/js/student-signup.js"></script>
</body>
</html>
