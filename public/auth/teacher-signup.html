<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher sign up</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class = "card">
        <h1>Teacher Sign Up</h1>
        <h2>Create your Teacher Account</h2>

        <form id="signupForm">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" required placeholder="e.g. John Doe">
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required minlength="6">
            </div>

            <div class="form-group">
                <label for="department">Department (Optional)</label>
                <input type="text" id="department" required>
            </div>

            <div class = "form-group">
                <label for = "specialization">Specialization (Optional)</label>
                <input type = "text" id = "specialization">
            </div>

            <div class = "form-group">
                <label for = "contact_number">Contact Number (Optional)</label>
                <input type = "text" id = "contact_number">
            </div>

            <button type="submit" id="submitBtn">Sign Up</button>
        </form>

            <div id="message" class="message"></div>

            <div class="link">
                Already have an account? <a href="/auth/teacher-login.html">Log in</a>
            </div>

            <div class="link">
                Are you A Student ?<a href="/auth/student-signup.html">Sign up as a student</a>
            </div>
    </div>

<script src="/auth/js/teacher-signup.js"></script>
</body>
</html>
