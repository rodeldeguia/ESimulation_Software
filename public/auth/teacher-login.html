<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Login — SSEGL</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="card">
    <h1>Teacher Login</h1>
    <h2>Welcome back to English Grammar Lessons</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>

      <button type="submit" id="submitBtn">Log In</button>
    </form>

    <div id="message" class="message"></div>

    <div class="link">
      Don't have an account? <a href="/auth/teacher-signup.html">Sign up</a>
    </div>
    <div class="link">
      Are you a student? <a href="/auth/student-login.html">Log in as Student</a>
    </div>
  </div>

  <script src="/auth/js/teacher-login.js"></script>
</body>
</html>
