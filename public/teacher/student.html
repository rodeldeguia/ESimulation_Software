<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Detail — SSEGL</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: block; padding: 24px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { color: white; margin-bottom: 24px; }
    .header h1 { font-size: 24px; }
    .header a { color: #93c5fd; text-decoration: none; font-size: 14px; }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .stat-card .num {
      font-size: 30px;
      font-weight: 800;
      color: #1e3a8a;
      margin-bottom: 4px;
    }
    .stat-card .label {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
    }

    .lessons-panel {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .lessons-panel h2 { color: #0f172a; margin-bottom: 16px; }
    .lesson-item {
      display: flex;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    .lesson-item:last-child { border-bottom: none; }
    .lesson-item h3 { font-size: 15px; color: #0f172a; margin-bottom: 4px; }
    .lesson-item p { font-size: 12px; color: #64748b; }
    .badge {
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge.passed    { background: #dcfce7; color: #166534; }
    .badge.failed    { background: #fee2e2; color: #991b1b; }
    .badge.locked    { background: #f1f5f9; color: #64748b; }
    .badge.reading_required { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <a href="/teacher/dashboard.html">← Back to Dashboard</a>
      <h1 id="title">Loading...</h1>
    </div>

    <div class="summary" id="summary"></div>
    <div class="lessons-panel">
      <h2>Lesson Progress</h2>
      <div id="lessonsList">Loading...</div>
    </div>
  </div>

  <script src="/teacher/student.js"></script>
</body>
</html>
