<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Lessons — SSEGL</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: block; padding: 0; background: #f1f5f9; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: #0f172a; color: white; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 24px 20px; font-weight: 700; font-size: 18px; border-bottom: 1px solid #1e293b; color: #93c5fd; }
    .nav-links { padding: 20px 12px; flex-grow: 1; }
    .nav-links a { display: block; padding: 12px 16px; color: #cbd5e1; text-decoration: none; border-radius: 6px; margin-bottom: 4px; font-size: 14px; }
    .nav-links a:hover { background: #1e293b; color: white; }
    .nav-links a.active { background: #1e3a8a; color: white; font-weight: 600; }
    .logout-btn { color: #f87171 !important; margin-top: auto; padding-bottom: 24px; }

    .main-content { flex-grow: 1; padding: 32px; overflow-y: auto; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .page-header h1 { color: #0f172a; font-size: 28px; }
    .btn-primary { background: #1e3a8a; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; display: inline-block; }

    .panel { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8fafc; padding: 14px; text-align: left; font-size: 12px; color: #64748b; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; }
    td { padding: 14px; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: #0f172a; }
    tr:last-child td { border-bottom: none; }
    .badge { padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; }
    .badge.published { background: #dcfce7; color: #166534; }
    .badge.draft { background: #fef3c7; color: #92400e; }
    .action-link { color: #1e3a8a; text-decoration: none; font-weight: 600; font-size: 13px; margin-right: 12px; }
    .action-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">English Grammar Lessons</div>
      <div class="nav-links">
        <a href="/teacher/dashboard.html">Dashboard</a>
        <a href="/teacher/lessons.html" class="active">Lessons</a>
        <a href="/teacher/lesson-editor.html">Create Lesson</a>
        <a href="/teacher/progress.html">Progress</a>
        <a href="#" class="logout-btn" id="logoutBtn">Log Out</a>
      </div>
    </aside>
    <main class="main-content">
      <div class="page-header">
        <h1>My Lessons</h1>
        <a href="/teacher/lesson-editor.html" class="btn-primary">+ Create Lesson</a>
      </div>
      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Title</th>
              <th>Grade</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="lessonsList">
            <tr><td colspan="5" style="text-align:center; padding:30px; color:#94a3b8;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/teacher/lessons.js"></script>
</body>
</html>
