<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Editor — SSEGL</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: block; padding: 40px 20px; background: #f1f5f9; }
    .container { max-width: 900px; margin: 0 auto; }
    .back { color: #1e3a8a; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 16px; }

    .card {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .card h1 { color: #1e3a8a; margin-bottom: 8px; font-size: 24px; }
    .card .subtitle { color: #64748b; font-size: 14px; margin-bottom: 20px; }

    .status-banner {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-banner.draft { background: #fef3c7; color: #92400e; }
    .status-banner.published { background: #dcfce7; color: #166534; }

    .question-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .question-item h4 { color: #1e3a8a; margin-bottom: 6px; }
    .question-item p { color: #475569; font-size: 13px; margin-bottom: 4px; }
    .question-item .correct { color: #16a34a; font-weight: 600; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #334155;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: #1e3a8a; }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-group small { color: #94a3b8; font-size: 12px; display: block; margin-top: 4px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .btn-primary { background: #1e3a8a; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-primary:hover { background: #1e40af; }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-success { background: #16a34a; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-success:hover { background: #15803d; }
    .btn-success:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-danger { background: #dc2626; color: white; padding: 6px 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }

    .message { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 13px; display: none; }
    .message.error { background: #fee2e2; color: #991b1b; display: block; }
    .message.success { background: #dcfce7; color: #166534; display: block; }

    .quiz-actions { margin-top: 20px; display: flex; gap: 12px; }
    .empty-state { text-align: center; padding: 40px; color: #64748b; font-size: 14px; }

    #dynamicQuestionForm { display: none; }
    #dynamicQuestionForm.active { display: block; }
  </style>
</head>
<body>

  <div class="container">
    <a class="back" href="/teacher/dashboard.html">← Back to Dashboard</a>

    <!-- Quiz Info Card -->
        <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:start;">
        <div>
          <h1 id="quizTitle">Loading...</h1>
          <p class="subtitle" id="quizMeta">...</p>
        </div>
        <button onclick="toggleSettings()" class="btn-primary" style="background:#475569;">⚙️ Edit Settings</button>
      </div>
      
      <!-- Hidden Settings Form -->
      <div id="quizSettings" style="display:none; margin-top:20px; padding:20px; background:#f8fafc; border-radius:8px; border:1px solid #e2e8f0;">
        <div class="row">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="setTitle">
          </div>
          <div class="form-group">
            <label>Passing Score (%)</label>
            <input type="number" id="setPassing">
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>Time Limit (min)</label>
            <input type="number" id="setTime">
          </div>
          <div class="form-group">
            <label>Max Attempts</label>
            <input type="number" id="setAttempts">
          </div>
          <div class="form-group">
            <label>Items to show Student (Randomized)</label>
            <input type="number" id="setItemsToShow" placeholder="e.g. 50">
          </div>
        </div>
        <button onclick="saveSettings()" class="btn-primary">Save Settings</button>
      </div>

      <div id="statusBanner"></div>
    </div>

    <!-- Questions List -->
    <div class="card">
      <h2 style="color:#0f172a; margin-bottom:16px;">Questions (<span id="questionCount">0</span>)</h2>
      <div id="questionsList">
        <div class="empty-state">Loading...</div>
      </div>
    </div>

    <!-- Add Question Form -->
    <div class="card">
      <h2 style="color:#0f172a; margin-bottom:16px;">Add New Question</h2>
      <form id="questionForm">
        <div id="dynamicQuestionForm">
          <!-- Filled dynamically by JS based on quiz type -->
        </div>
        <button type="submit" id="addBtn" class="btn-primary" style="margin-top:12px;">Add Question</button>
      </form>
      <div id="message" class="message"></div>
    </div>

    <!-- Publish Button -->
    <div class="quiz-actions">
      <button id="publishBtn" class="btn-success">Publish Quiz to Students</button>
      <a href="/teacher/dashboard.html" class="btn-primary" style="text-decoration:none; display:inline-block;">Done</a>
    </div>
  </div>

  <script src="/teacher/quiz-editor.js"></script>
</body>
</html>
