<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Quiz — SSEGL</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: block; padding: 40px 20px; background: #f1f5f9; }
    .container { max-width: 700px; margin: 0 auto; background: white; border-radius: 12px; padding: 40px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .container h1 { color: #1e3a8a; margin-bottom: 8px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; color: #334155; margin-bottom: 8px; font-weight: 600; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    button { width: 100%; padding: 14px; background: #1e3a8a; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1e40af; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/teacher/quizzes.html" style="color:#1e3a8a; text-decoration:none; font-size:13px; display:inline-block; margin-bottom:16px;">← Back to Quizzes</a>
    <h1>Create Final Quiz</h1>
    <p style="color:#64748b; font-size:14px; margin-bottom:32px;">Select a lesson and choose the type of quiz.</p>

        <form id="quizForm">
      <div class="form-group">
        <label>Select Lesson</label>
        <select id="lesson_id" required>
          <option value="">Loading...</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Quiz Type</label>
        <select id="quiz_type" required>
          <option value="preposition">Preposition (Multiple Choice)</option>
          <option value="irregular_verb">Irregular Verb (Fill in blanks)</option>
          <option value="clause">Clause (Two-step)</option>
          <option value="sva">Subject-Verb Agreement</option>
          <option value="phrasal_verb">Phrasal Verb</option>
          <option value="sentence_pattern">Sentence Pattern</option>
        </select>
      </div>

      <div class="form-group">
        <label>Quiz Title</label>
        <input type="text" id="title" required placeholder="e.g., Prepositions Final Exam">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px;">
        <div class="form-group" style="margin-bottom: 0;">
          <label>Passing Score (%)</label>
          <input type="number" id="passing_score" required min="1" max="100" value="70">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label>Time Limit (Mins)</label>
          <input type="number" id="time_limit" min="1" placeholder="e.g. 10" value="10">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label>Max Attempts</label>
          <input type="number" id="max_quiz_attempts" min="1" value="3">
        </div>
      </div>

      <button type="submit" id="submitBtn">Create Quiz & Add Questions →</button>
    </form>
  </div>

  <script src="/teacher/create-quiz.js"></script>
</body>
</html>
