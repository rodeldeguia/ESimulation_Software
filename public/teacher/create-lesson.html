<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Lesson — SSEGL</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: block; padding: 40px 20px; }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 40px;
    }
    .container h1 { color: #1e3a8a; margin-bottom: 24px; }
    textarea {
      width: 100%;
      min-height: 200px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
    }
    .back { color: #1e3a8a; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 16px; }
  </style>

    <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
</head>
<body>

  <div class="container">
    <a class="back" href="/teacher/dashboard.html">← Back to Dashboard</a>
    <h1>Create a Lesson</h1>

    <form id="lessonForm">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" required>
      </div>

      <div class="form-group">
        <label for="lesson_order">Lesson Order (number)</label>
        <input type="number" id="lesson_order" required min="1">
      </div>

      <div class="form-group">
        <label for="grade_level">Grade Level</label>
        <select id="grade_level" required>
          <option value="7">Grade 7</option>
          <option value="8">Grade 8</option>
          <option value="9">Grade 9</option>
          <option value="10">Grade 10</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Short Description</label>
        <input type="text" id="description">
      </div>

      <div class="form-group">
        <label for="discussion_content">Lesson Content</label>
        <textarea id="discussion_content" required placeholder="<p>Your lesson content here...</p>"></textarea>
      </div>

      <div class="form-group">
        <label for="prerequisite_lesson_id">Prerequisite Lesson ID (optional)</label>
        <input type="number" id="prerequisite_lesson_id">
      </div>

      <button type="submit" id="submitBtn">Create Lesson</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script src="/teacher/create-lesson.js"></script>

    <script>
    tinymce.init({
      selector: '#discussion_content',
      height: 400,
      menubar: false,
      plugins: 'lists link table code',
      toolbar: 'undo redo | formatselect | bold italic underline | bullist numlist | link table | code | removeformat',
      content_style: 'body { font-family: Segoe UI, Tahoma, sans-serif; font-size: 15px; line-height: 1.6; }'
    });
  </script>
</body>
</html>
