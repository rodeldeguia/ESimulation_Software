<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — SSEGL</title>
  <link rel="stylesheet" href="/css/shared.css">
  
  <!-- Dashboard-specific styles (Stat Cards & Panels) -->
  <style>
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-bottom: 30px; }
    .stat-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
    .stat-card h3 { font-size: 14px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
    .stat-card .value { font-size: 32px; font-weight: 800; color: var(--navy); }
    
    .panel { background: white; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
    .panel-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
    .panel-header h2 { font-size: 18px; color: var(--navy); margin: 0; }
    .panel-body { padding: 24px; }
    .btn-view { background: var(--navy); color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>

   <!-- HEADER -->
  <header class="header">
    
    <!-- LEFT SIDE: Hamburger + Logo -->
    <div style="display: flex; align-items: center;">
      <!-- Hamburger -->
      <div class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('active')">
        ☰
      </div>
      <!-- Logo -->
      <div class="header-logo">English Grammar<br><span>Lessons</span></div>
    </div>

    <!-- MIDDLE: Search -->
    <div class="header-search">
      <svg width="16" height="16" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input type="text" placeholder="Search here...">
    </div>

    <!-- RIGHT SIDE: Profile -->
    <div class="header-user">
      <img id="headerProfilePic" src="https://ui-avatars.com/api/?name=Admin&background=1e3a8a&color=fff" alt="Admin">
      <div>
        <div style="font-weight: 600;" id="navUserName">Loading...</div>
        <div style="font-size: 12px; color: #94a3b8;">Administrator</div>
      </div>
    </div>
    <style>
    /* --- STAT CARDS --- */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-bottom: 30px; }
    .stat-card { 
      background: white; border-radius: 12px; padding: 24px; 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color);
      display: flex; flex-direction: column; justify-content: center;
      transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-4px); }
    .stat-card h3 { font-size: 13px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 36px; font-weight: 800; color: var(--navy); line-height: 1; }
    
    /* --- PANEL CONTAINER --- */
    .panel { background: white; border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .panel-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
    .panel-header h2 { font-size: 18px; color: var(--navy); margin: 0; font-weight: 700; }
    .btn-view { background: var(--navy); color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; transition: 0.2s; }
    .btn-view:hover { background: var(--primary-blue); }
    
    /* --- LIST ITEMS (For pending lessons) --- */
    .panel-body { padding: 0; }
    .list-item { padding: 16px 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: #f8fafc; }
    .list-item-title { font-weight: 600; color: var(--text-main); font-size: 15px; margin-bottom: 4px; }
    .list-item-meta { font-size: 13px; color: var(--text-muted); }
    
    /* Small badges for the list */
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; background: #fef3c7; color: #92400e; }
  </style>

  </header>

  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" id = "sidebar">
      <div class="sidebar-header">Admin Panel</div>
      <div class="nav-links">
        <a href="/admin/dashboard.html" class="active">Dashboard</a>
        <a href="/admin/teachers.html">Manage Teachers</a>
        <a href="/admin/students.html">Manage Students</a>
        <a href="/admin/approvals.html">Lesson Approvals</a>
        <a href="/admin/dictionary.html">Grammar Dictionary</a>
        <a href="/admin/logs.html">Activity Logs</a>
        <a href="/admin/settings.html">Settings</a>
        <a href="#" class="logout-btn" id="logoutBtn">Log Out</a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header">
        <h1>Overview</h1>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="statsGrid">
        <!-- Filled by JS -->
        <div class="stat-card"><h3>Loading...</h3></div>
      </div>

      <!-- Pending Approvals Quick View -->
      <div class="panel">
        <div class="panel-header">
          <h2>Lessons Waiting for Approval</h2>
          <a href="/admin/approvals.html" class="btn-view">View All</a>
        </div>
        <div class="panel-body" id="pendingLessons">
          Loading...
        </div>
      </div>
    </main>
  </div>

  <!-- SCRIPTS -->
  <script src="/js/auth-check.js"></script>
  <script src="/js/header-profile.js"></script>
  <script src="/admin/dashboard.js"></script>
</body>
</html>
