<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lesson Approvals — SSEGL</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: block; padding: 0; background: #f1f5f9; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: #0f172a; color: white; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 24px 20px; font-weight: 700; font-size: 18px; border-bottom: 1px solid #1e293b; color: #93c5fd; }
    .nav-links { padding: 20px 12px; flex-grow: 1; }
    .nav-links a { display: block; padding: 12px 16px; color: #cbd5e1; text-decoration: none; border-radius: 6px; margin-bottom: 4px; font-size: 14px; }
    .nav-links a:hover { background: #1e293b; color: white; }
    .nav-links a.active { background: #1e3a8a; color: white; font-weight: 600; }
    .logout-btn { color: #f87171 !important; margin-top: auto; padding-bottom: 24px; }
    .main-content { flex-grow: 1; padding: 32px; overflow-y: auto; }
    .page-header { margin-bottom: 24px; }
    .page-header h1 { color: #0f172a; font-size: 28px; }

    .approval-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .approval-card .info h3 { color: #0f172a; font-size: 18px; margin-bottom: 8px; }
    .approval-card .info p { color: #64748b; font-size: 14px; margin-bottom: 4px; }
    .approval-card .info .meta { font-size: 12px; color: #94a3b8; margin-top: 8px; }
    .actions { display: flex; gap: 10px; flex-shrink: 0; }
    .btn-approve { background: #16a34a; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-approve:hover { background: #15803d; }
    .btn-reject { background: #fee2e2; color: #991b1b; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-reject:hover { background: #fca5a5; }
    .empty { background: white; padding: 40px; text-align: center; border-radius: 12px; color: #64748b; }
  </style>
</head>
<body>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">Admin Panel</div>
      <div class="nav-links">
        <a href="/admin/dashboard.html">📊 Dashboard</a>
        <a href="/admin/teachers.html">👨‍🏫 Manage Teachers</a>
        <a href="/admin/students.html">👨‍🎓 Manage Students</a>
        <a href="/admin/approvals.html" class="active">✅ Lesson Approval</a>
        <a href="/admin/logs.html">📜 Activity Logs</a>
        <a href="#" class="logout-btn" id="logoutBtn">🚪 Log Out</a>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>Lesson Approval Queue</h1>
      </div>
      <div id="approvalList">Loading...</div>
    </main>
  </div>

  <script src="/admin/approvals.js"></script>
</body>
</html>
