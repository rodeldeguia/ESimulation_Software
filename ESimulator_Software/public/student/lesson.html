<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson — SSEGL</title>
  <link rel="stylesheet" href="/css/shared.css">
  
  <style>
    /* Main Reading Container */
    .lesson-container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      max-width: 900px;
      margin: 0 auto;
    }

    .lesson-header {
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    
    .lesson-header h1 {
      color: var(--navy);
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    
    .lesson-header .meta {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
    }

    /* Lesson Content Styling (Rich Text from TinyMCE) */
    .content { line-height: 1.8; color: #1e293b; font-size: 16px; }
    
    .content h1 { color: #2c3e50; border-bottom: 3px solid var(--primary-blue); padding-bottom: 10px; margin-top: 30px; }
    .content h2 { color: #34495e; margin-top: 30px; border-left: 4px solid var(--primary-blue); padding-left: 15px; font-size: 22px; }
    .content h3 { color: #555; margin-top: 25px; font-size: 18px; }

    /* Custom Boxes */
    .content .info-box-blue { background: #e3f2fd; border-left: 6px solid #2196F3; padding: 20px; margin: 25px 0; border-radius: 8px; }
    .content .info-box-blue h3 { color: #1976D2; margin-top: 0; border: none; padding: 0; }
    
    .content .tip-box-green { background: #e8f5e9; border-left: 6px solid #4CAF50; padding: 20px; margin: 25px 0; border-radius: 8px; }
    .content .tip-box-green h3 { color: #2E7D32; margin-top: 0; border: none; padding: 0; }

    .content .warning-box-yellow { background: #fff3e0; border-left: 6px solid #FF9800; padding: 20px; margin: 25px 0; border-radius: 8px; }
    .content .warning-box-yellow h3 { color: #E65100; margin-top: 0; border: none; padding: 0; }

    .content .important-box-red { background: #ffebee; border-left: 6px solid #f44336; padding: 20px; margin: 25px 0; border-radius: 8px; }
    .content .important-box-red h3 { color: #c62828; margin-top: 0; border: none; padding: 0; }

    /* Grammar Example */
    .content .grammar-example { background: linear-gradient(135deg, #667eea 10%, #764ba2 100%); color: white; padding: 25px; margin: 25px 0; border-radius: 10px; }
    .content .grammar-example h3 { color: white; margin-top: 0; border-bottom: 2px solid white; display: inline-block; padding-bottom: 5px; }
    .content .grammar-example strong { color: #FFD700; }
    .content .grammar-example .explanation { background: rgba(255,255,255,0.2); padding: 10px; border-radius: 5px; margin-top: 15px; font-style: italic; }

    /* Tables & Code */
    .content table { width: 100%; border-collapse: collapse; margin: 20px 0; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px var(--border-color); }
    .content th, .content td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    .content th { background: var(--navy); color: white; font-weight: 600; }
    .content pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-left: 4px solid var(--primary-blue); border-radius: 5px; overflow-x: auto; }
    .content code { background: #f4f4f4; padding: 2px 5px; border-radius: 3px; font-family: monospace; color: #dc2626; }

    /* Quiz Section */
    .quiz-section { margin-top: 40px; border-top: 2px solid #f1f5f9; padding-top: 30px; }
    .quiz-section h2 { color: var(--navy); margin-bottom: 16px; font-size: 22px; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div style="display: flex; align-items: center;">
      <div class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('active')">☰</div>
      <div class="header-logo">English Grammar<br><span>Lessons</span></div>
    </div>
    <div class="header-search">
      <svg width="16" height="16" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input type="text" placeholder="Search here...">
    </div>
    <div class="header-user">
      <img id="headerProfilePic" src="https://ui-avatars.com/api/?name=Student&background=1e3a8a&color=fff" alt="Student">
      <div>
        <div style="font-weight: 600;" id="navUserName">Loading...</div>
        <div style="font-size: 12px; color: #94a3b8;" id="navUserGrade">Grade --</div>
      </div>
    </div>
  </header>

  <!-- LAYOUT -->
  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">Student Panel</div>
      <div class="nav-links">
        <a href="/student/dashboard.html">Home</a>
        <a href="/student/lessons.html" class="active">Lessons</a>
        <a href="/student/final-quizzes.html">Final Quizzes</a>
        <a href="/student/progress.html">Progress</a>

        <a href="/student/settings.html">Settings</a>
        <a href="#" class="logout-btn" id="logoutBtn">Log Out</a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header" style="border-bottom: none; margin-bottom: 10px;">
        <a href="/student/lessons.html" style="color: var(--text-muted); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px;">
          ← Back to Lessons
        </a>
      </div>

      <div class="lesson-container" id="lessonContent">
        <div style="text-align: center; padding: 40px; color: var(--text-muted);">Loading lesson...</div>
      </div>
    </main>
  </div>

  

  <!-- SCRIPTS -->
  <script src="/js/auth-check.js"></script>
  <script src="/js/header-profile.js"></script>
  <script src="/student/lesson.js"></script>
</body>
</html>
