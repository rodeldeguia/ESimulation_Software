<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Lessons — SSEGL</title>
  <link rel="stylesheet" href="/css/shared.css">
  
  <style>
    /* Reusing the exact Lesson Grid styles from the dashboard */
    .lessons-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
      gap: 24px; 
      margin-top: 10px;
    }
    
    .lesson-card {
      background: white; 
      border-radius: 12px; 
      padding: 24px; 
      text-align: center;
      border: 1px solid var(--border-color); 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
    }
    
    .lesson-card:hover:not(.locked) { 
      transform: translateY(-4px); 
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
      border-color: var(--primary-blue);
    }
    
    .lesson-card.locked {
      opacity: 0.6;
      cursor: not-allowed;
      background: #f8fafc;
    }

    .circle-num {
      width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 800; color: white; margin: 0 auto 16px auto;
    }
    
    /* Colors matching your screenshot */
    .c-green { background: #10b981; }
    .c-blue { background: #3b82f6; }
    .c-yellow { background: #f59e0b; }
    .c-purple { background: #8b5cf6; }
    .c-pink { background: #ec4899; }
    
    .lesson-title { font-weight: 700; color: var(--navy); font-size: 16px; margin-bottom: 12px; line-height: 1.3; }
    .lesson-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; flex-grow: 1; }
    
    .status-locked { color: var(--text-muted); font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .btn-view { background: #dcfce7; color: #166534; width: 100%; padding: 10px; border-radius: 6px; font-weight: 600; text-decoration: none; display: block; font-size: 14px; transition: 0.2s; }
    .lesson-card:hover:not(.locked) .btn-view { background: #bbf7d0; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div style="display: flex; align-items: center;">
      <div class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('active')">☰</div>
      <div class="header-logo">English Grammar<br><span>Lessons</span></div>
    </div>
    <div class="header-search">
      <svg width="16" height="16" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input type="text" placeholder="Search here...">
    </div>
    <div class="header-user">
      <img id="headerProfilePic" src="https://ui-avatars.com/api/?name=Student&background=1e3a8a&color=fff" alt="Student">
      <div>
        <div style="font-weight: 600;" id="navUserName">Loading...</div>
        <div style="font-size: 12px; color: #94a3b8;" id="navUserGrade">Grade --</div>
      </div>
    </div>
  </header>

  <!-- LAYOUT -->
  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">Student Panel</div>
      <div class="nav-links">
        <a href="/student/dashboard.html">Home</a>
        <a href="/student/lessons.html" class="active">Lessons</a>
        <a href="/student/final-quizzes.html">Final Quizzes</a>
        <a href="/student/progress.html">Progress</a>
                <a href="/student/settings.html" >Settings</a>
        <a href="#" class="logout-btn" id="logoutBtn">Log Out</a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header">
        <h1>Your Lessons</h1>
      </div>

      <!-- Lesson Grid Container -->
      <div class="lessons-grid" id="lessonsList">
        <div style="padding: 20px; color: var(--text-muted); grid-column: 1 / -1; text-align: center;">
          Loading lessons...
        </div>
      </div>

    </main>
  </div>

  <!-- SCRIPTS -->
  <script src="/js/auth-check.js"></script>
  <script src="/js/header-profile.js"></script>
  <script src="/student/lessons.js"></script>
</body>
</html>
