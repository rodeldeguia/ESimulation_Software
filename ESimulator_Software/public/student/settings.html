<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — SSEGL</title>
  <link rel="stylesheet" href="/css/shared.css">
  
  <style>
    /* Settings Page Layout */
    .settings-container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .settings-card {
      background: white;
      border-radius: 12px;
      padding: 32px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 24px;
    }
    
    .settings-card h2 {
      font-size: 20px;
      color: var(--navy);
      margin-bottom: 8px;
      font-weight: 700;
    }
    
    .settings-card p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f1f5f9;
    }

    /* Profile Picture Section */
    .profile-pic-section {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 24px;
    }
    
    .profile-pic-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      background: #e2e8f0;
      border: 3px solid white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .file-input-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* Buttons */
    .btn-save {
      background: var(--primary-blue);
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      margin-top: 10px;
    }
    
    .btn-save:hover {
      background: #1e40af;
    }

    /* Alert Messages */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
      display: none;
    }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div style="display: flex; align-items: center;">
      <div class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('active')">☰</div>
      <div class="header-logo">English Grammar<br><span>Lessons</span></div>
    </div>
    <div class="header-search">
      <svg width="16" height="16" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input type="text" placeholder="Search here...">
    </div>
    <div class="header-user">
      <img id="headerProfilePic" src="https://ui-avatars.com/api/?name=Student&background=1e3a8a&color=fff" alt="Student">
      <div>
        <div style="font-weight: 600;" id="navUserName">Loading...</div>
        <div style="font-size: 12px; color: #94a3b8;" id="navUserGrade">Grade --</div>
      </div>
    </div>
  </header>

  <!-- LAYOUT -->
  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">Student Panel</div>
      <div class="nav-links">
        <a href="/student/dashboard.html">Home</a>
        <a href="/student/lessons.html">Lessons</a>
        <a href="/student/final-quizzes.html">Final Quizzes</a>
        <a href="/student/progress.html">Progress</a>
        <a href="/student/settings.html" class="active">Settings</a>
        <a href="#" class="logout-btn" id="logoutBtn">Log Out</a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header">
        <h1>Settings</h1>
      </div>

      <div class="settings-container">
        
        <!-- Profile Information Card -->
        <div class="settings-card">
          <h2>Profile Information</h2>
          <p class="subtitle">Update your account details here.</p>
          
          <div id="profileAlert" class="alert"></div>

          <form id="profileForm">
            <div class="profile-pic-section">
              <img id="profilePicPreview" src="https://ui-avatars.com/api/?name=Student&background=1e3a8a&color=fff" alt="Profile" class="profile-pic-preview">
              <div>
                <div class="file-input-wrapper">
                  <button type="button" class="btn" style="background:#f1f5f9; color:var(--navy); border:1px solid var(--border-color);">Choose File</button>
                  <input type="file" id="profilePicInput" accept="image/*">
                </div>
                <div style="font-size:12px; color:var(--text-muted); margin-top:8px;">JPG, PNG or GIF. Max size 2MB.</div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" required>
              </div>
              <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required disabled style="background:#f8fafc; cursor:not-allowed;">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Grade Level</label>
                <input type="text" id="gradeLevel" disabled style="background:#f8fafc; cursor:not-allowed;">
              </div>
              <div class="form-group">
                <label>Birth Date</label>
                <input type="date" id="birthDate">
              </div>
            </div>

            <button type="submit" class="btn-save">Save Changes</button>
          </form>
        </div>

        <!-- Change Password Card -->
        <div class="settings-card">
          <h2>Change Password</h2>
          <p class="subtitle">Ensure your account is using a long, random password to stay secure.</p>

          <div id="passwordAlert" class="alert"></div>

          <form id="passwordForm">
            <div class="form-row">
              <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="currentPassword" required placeholder="Enter current password">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" required placeholder="Enter new password" minlength="6">
              </div>
              <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" required placeholder="Confirm new password" minlength="6">
              </div>
            </div>

            <button type="submit" class="btn-save">Update Password</button>
          </form>
        </div>

      </div>
    </main>
  </div>

  <!-- SCRIPTS -->
  <script src="/js/auth-check.js"></script>
  <script src="/js/header-profile.js"></script>
  <script src="/student/settings.js"></script>
</body>
</html>
