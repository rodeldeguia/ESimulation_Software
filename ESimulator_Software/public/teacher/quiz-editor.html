<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Editor — SSEGL</title>
  <link rel="stylesheet" href="/css/shared.css">
  
  <style>
    /* Layout Grid */
    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; margin-top: 24px; }
    
    /* Cards */
    .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
    .card h2 { font-size: 18px; color: var(--navy); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
    
    /* Form Settings */
    .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    
    /* Status Banner */
    .status-banner { padding: 16px 24px; border-radius: 8px; margin-bottom: 24px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .status-banner.draft { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .status-banner.published { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }

    /* Question List Items */
    .question-item { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .question-item h4 { color: var(--navy); margin-bottom: 6px; font-size: 15px; }
    .question-item p { color: var(--text-muted); font-size: 13px; margin-bottom: 4px; }
    .question-item .correct { color: #16a34a; font-weight: 600; }
    
    /* Alerts */
    .message { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 13px; display: none; }
    .message.error { background: #fee2e2; color: #991b1b; display: block; border: 1px solid #fecaca; }
    .message.success { background: #dcfce7; color: #166534; display: block; border: 1px solid #bbf7d0; }

    @media (max-width: 900px) {
      .editor-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div style="display: flex; align-items: center;">
      <div class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('active')">☰</div>
      <div class="header-logo">English Grammar<br><span>Lessons</span></div>
    </div>
    <div class="header-search">
      <svg width="16" height="16" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input type="text" placeholder="Search here...">
    </div>
    <div class="header-user">
      <img id="headerProfilePic" src="https://ui-avatars.com/api/?name=Teacher&background=1e3a8a&color=fff" alt="Teacher">
      <div>
        <div style="font-weight: 600;" id="navUserName">Loading...</div>
        <div style="font-size: 12px; color: #94a3b8;">Teacher</div>
      </div>
    </div>
  </header>

  <!-- LAYOUT -->
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">Teacher Panel</div>
      <div class="nav-links">
        <a href="/teacher/dashboard.html">Dashboard</a>
        <a href="/teacher/students.html">Students</a>
        <a href="/teacher/lessons.html">Lessons</a>
        <a href="/teacher/quizzes.html" class="active">Quizzes</a>
        <a href="/teacher/progress.html">Progress</a>
        <a href="/teacher/analytics.html">Analytics</a>
        <!-- <a href="/teacher/dictionary.html">Grammar Dictionary</a> -->
        <a href="/teacher/settings.html">Settings</a>
        <a href="#" class="logout-btn" id="logoutBtn">Log Out</a>
      </div>
    </aside>

    <main class="main-content">
      
      <div class="page-header">
        <div style="display:flex; align-items:center; gap:16px;">
          <a href="/teacher/quizzes.html" style="text-decoration:none; color:var(--navy); font-size:24px; font-weight:bold; margin-top:-4px;">←</a>
          <div>
            <h1 id="quizTitle" style="margin-bottom: 4px;">Loading...</h1>
            <p id="quizMeta" style="color: var(--text-muted); font-size: 14px;">...</p>
          </div>
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
          <button id="publishBtn" class="btn btn-approve" style="background:#16a34a; color:white;">Publish Quiz</button>
          <button onclick="previewQuiz()" class="btn" style="background:var(--navy); color:white;">👁️ Preview</button>
        </div>
      </div>

      <div id="statusBanner"></div>

      <!-- QUIZ SETTINGS -->
      <div class="card" style="margin-bottom: 24px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2>Quiz Settings</h2>
          <button onclick="toggleSettings()" class="btn" style="background:#f1f5f9; color:var(--text-main); padding: 6px 12px; font-size: 12px;">⚙️ Edit</button>
        </div>
        
        <div id="quizSettings" style="display:none; margin-top:16px; padding-top:16px; border-top:1px solid var(--border-color);">
          <div class="settings-grid">
            <div class="form-group"><label>Title</label><input type="text" id="setTitle"></div>
            <div class="form-group"><label>Passing Score (%)</label><input type="number" id="setPassing"></div>
            <div class="form-group"><label>Time Limit (min)</label><input type="number" id="setTime"></div>
            <div class="form-group"><label>Max Attempts</label><input type="number" id="setAttempts"></div>
            <div class="form-group"><label>Items to Show</label><input type="number" id="setItemsToShow"></div>
          </div>
          <button onclick="saveSettings()" class="btn btn-primary" style="width:100%;">Save Settings</button>
        </div>
      </div>

      <!-- SIDE BY SIDE: FORM & LIST -->
      <div class="editor-grid">
        
        <!-- LEFT: ADD QUESTION FORM -->
        <div class="card">
          <h2>Add New Question</h2>
          <form id="questionForm">
            <div id="dynamicQuestionForm"></div>
            <button type="submit" id="addBtn" class="btn btn-primary" style="margin-top:16px; width: 100%;">Add Question</button>
          </form>
          <div id="message" class="message"></div>
        </div>

        <!-- RIGHT: QUESTIONS LIST -->
        <div class="card" style="min-height: 400px;">
          <h2>Created Questions (<span id="questionCount">0</span>)</h2>
          <div id="questionsList"></div>
        </div>

      </div>

    </main>
  </div>

  <!-- EDIT QUESTION MODAL -->
  <div id="editQuestionModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(10,25,48,0.8); z-index:99999; justify-content:center; align-items:center; padding:20px; overflow-y:auto;">
    <div style="background:white; width:800px; max-width:100%; border-radius:12px; padding:32px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1); max-height:90vh; overflow-y:auto;">
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; border-bottom:1px solid var(--border-color); padding-bottom:16px;">
        <h2 style="color:var(--navy); margin:0; font-size:22px; font-weight:800;">✏️ Edit Question</h2>
        <button onclick="closeEditModal()" style="background:none; border:none; font-size:28px; cursor:pointer; color:var(--text-muted);">&times;</button>
      </div>

      <form id="editQuestionForm">
        <div id="editDynamicFields"></div>
        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px; border-top:1px solid var(--border-color); padding-top:20px;">
          <button type="button" onclick="closeEditModal()" class="btn" style="background:#f1f5f9; color:var(--text-main);">Cancel</button>
          <button type="submit" id="updateQBtn" class="btn btn-primary">💾 Update Question</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/auth-check.js"></script>
  <script src="/js/header-profile.js"></script>
  <script src="/js/quiz-editor.js"></script>
</body>
</html>
