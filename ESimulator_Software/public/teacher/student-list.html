<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student List — SSEGL</title>
  <style>
    :root {
      --navy: #0a1930;
      --gold: #fbbf24;
      --bg-light: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body { background-color: var(--bg-light); display: flex; min-height: 100vh; flex-direction: column; }

    /* Header */
    .header { background-color: var(--navy); height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; color: white; }
    .header-logo { font-weight: 700; font-size: 16px; line-height: 1.2; }
    .header-search { background: white; border-radius: 20px; padding: 8px 16px; width: 400px; display: flex; align-items: center; gap: 10px; }
    .header-search input { border: none; outline: none; width: 100%; font-size: 14px; }
    .header-user { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .header-user img { width: 36px; height: 36px; border-radius: 50%; background: #ccc; }

    /* Layout */
    .layout { display: flex; flex-grow: 1; }
    .sidebar { width: 220px; background-color: var(--navy); padding-top: 10px; display: flex; flex-direction: column; }
    .sidebar a { padding: 16px 24px; color: white; text-decoration: none; font-size: 16px; font-weight: 500; display: block; }
    .sidebar a:hover { background-color: rgba(255,255,255,0.1); }
    .sidebar a.active { background-color: var(--gold); color: var(--navy); font-weight: 700; }
    .logout-btn { margin-top: auto; padding-bottom: 30px !important; color: #f87171 !important; }

    /* Main Content */
    .main-content { flex-grow: 1; padding: 30px; }
    .page-header { display: flex; align-items: center; gap: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 30px; }
    .page-header h1 { font-size: 32px; color: var(--navy); font-weight: 800; }

    /* Table Container */
    .table-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      overflow: hidden;
      max-width: 1100px;
      margin: 0 auto;
    }
    
    .table-header {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    .table-header h2 { font-size: 20px; color: var(--navy); display: flex; align-items: center; gap: 12px; font-weight: 700; }
    .btn-back { color: var(--navy); text-decoration: none; font-size: 24px; font-weight: bold; cursor: pointer; }
    .btn-add {
      background: var(--navy);
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-add:hover { background: #1e3a8a; }

    /* Table */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 16px 24px; background: #f8fafc; font-size: 13px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; }
    td { padding: 16px 24px; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: var(--text-main); }
    tr:hover td { background: #f8fafc; }

    /* Actions */
    .action-link { color: var(--navy); text-decoration: none; font-weight: 600; font-size: 13px; margin-right: 16px; }
    .action-link:hover { text-decoration: underline; }
    .icon-btn { text-decoration: none; font-size: 18px; margin-right: 12px; cursor: pointer; border: none; background: transparent; }
    .icon-edit { color: var(--navy); }
    .icon-delete { color: #dc2626; }
    
    .empty-state { padding: 40px; text-align: center; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-logo">English Grammar<br>Lesson</div>
    <div class="header-search">
      <svg width="18" height="18" fill="none" stroke="#666" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input type="text" placeholder="Search here...">
    </div>
    <div class="header-user">
      <img id="headerProfilePic"src="https://ui-avatars.com/api/?name=Teacher&background=1e3a8a&color=fff" alt="User">
      <div>
        <div style="font-weight: 600;" id="teacherName">Loading...</div>
        <div style="font-size: 12px; color: #aaa;">Teacher</div>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="layout">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="/teacher/dashboard.html">Dashboard</a>
      <a href="/teacher/students.html" class="active">Students</a>
      <a href="/teacher/lessons.html">Lessons</a>
      <a href="/teacher/quizzes.html">Quizzes</a>
      <a href="/teacher/progress.html">Progress</a>
  <!-- <a href="/teacher/dictionary.html">Grammar Dictionary</a> -->
      <a href="/teacher/analytics.html" class="active">Analytics</a> 
      <a href="/teacher/settings.html">Settings</a>
    </aside>

    <!-- Content -->
    <main class="main-content">
      <div class="page-header">
        <h1>Students</h1>
      </div>

      <div class="table-container">
        <div class="table-header">
          <h2>
            <a href="/teacher/students.html" class="btn-back">←</a>
            <span id="gradeTitle">Loading...</span>
          </h2>
          <button class="btn-add" onclick="alert('Add student feature coming soon!')">+ Add Student</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>No.</th>
              <th>Last Name</th>
              <th>First Name</th>
              <th>Sex</th>
              <th>Year Level</th>
              <th>Progress</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <tr><td colspan="7" class="empty-state">Loading students...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
<script src="/js/auth-check.js"></script>
  <script src="/js/teacher-student-list.js"></script>
  <script src="/js/header-profile.js"></script>
</body>
</html>
