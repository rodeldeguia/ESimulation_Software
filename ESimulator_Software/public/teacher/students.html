<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students Overview — SSEGL</title>
  <link rel="stylesheet" href="/css/shared.css">
  
  <style>
    /* Additional styling for the student table */
    .search-bar-container { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .search-bar-container input { flex: 1; max-width: 400px; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
    .search-bar-container input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
    
    .action-link { color: var(--primary-blue); text-decoration: none; font-weight: 600; font-size: 14px; padding: 6px 12px; background: #eff6ff; border-radius: 6px; transition: 0.2s; }
    .action-link:hover { background: #dbeafe; }
    
    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .status-active { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>

  <!-- HEADER (Same as Admin) -->
  <header class="header">
    <div style="display: flex; align-items: center;">
      <div class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('active')">☰</div>
      <div class="header-logo">English Grammar<br><span>Lessons</span></div>
    </div>
    <div class="header-search">
      <svg width="16" height="16" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input type="text" placeholder="Search here...">
    </div>
    <div class="header-user">
      <img id="headerProfilePic" src="https://ui-avatars.com/api/?name=Teacher&background=1e3a8a&color=fff" alt="Teacher">
      <div>
        <div style="font-weight: 600;" id="navUserName">Loading...</div>
        <div style="font-size: 12px; color: #94a3b8;">Teacher</div>
      </div>
    </div>
  </header>

  <!-- LAYOUT -->
  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">Teacher Panel</div>
      <div class="nav-links">
        <a href="/teacher/dashboard.html">Dashboard</a>
        <a href="/teacher/students.html" class="active">Students</a>
        <a href="/teacher/lessons.html">Lessons</a>
        <a href="/teacher/quizzes.html">Quizzes</a>
        <a href="/teacher/progress.html">Progress</a>
        <a href="/teacher/analytics.html">Analytics</a>
        <!-- <a href="/teacher/dictionary.html">Grammar Dictionary</a> -->
        <a href="/teacher/settings.html">Settings</a>
        <a href="#" class="logout-btn" id="logoutBtn">Log Out</a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header">
        <h1>Student Directory</h1>
      </div>

      <!-- Search and Filter Area -->
      <div class="search-bar-container">
        <input type="text" id="searchInput" placeholder="Search by name or grade..." onkeyup="filterTable()">
        <span style="color: var(--text-muted); font-size: 14px;">Total: <strong id="totalCount">0</strong> students</span>
      </div>

      <!-- Master Student Table -->
      <div class="table-container">
        <table id="studentTable">
          <thead>
            <tr>
              <th>No.</th>
              <th>Student Name</th>
              <th>Grade Level</th>
              <th>Lessons Passed</th>
              <th>Progress</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted);">Loading students...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- SCRIPTS -->
  <script src="/js/auth-check.js"></script>
  <script src="/js/header-profile.js"></script>
  <script src="/js/teacher-students.js"></script>
</body>
</html>
