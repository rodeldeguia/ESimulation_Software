<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Quiz — SSEGL</title>
  <link rel="stylesheet" href="/css/shared.css">
  
  <style>
    /* Form-specific styles */
    .form-card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color); max-width: 800px; margin: 0 auto; }
    .form-card h2 { color: var(--navy); font-size: 22px; margin-bottom: 8px; }
    .form-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    
    .btn-submit { width: 100%; padding: 14px; background: var(--navy); color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { background: var(--primary-blue); }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    
    .back-link { display: inline-block; color: var(--navy); text-decoration: none; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div style="display: flex; align-items: center;">
      <div class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('active')">☰</div>
      <div class="header-logo">English Grammar<br><span>Lessons</span></div>
    </div>
    <div class="header-search">
      <svg width="16" height="16" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input type="text" placeholder="Search here...">
    </div>
    <div class="header-user">
      <img id="headerProfilePic" src="https://ui-avatars.com/api/?name=Teacher&background=1e3a8a&color=fff" alt="Teacher">
      <div>
        <div style="font-weight: 600;" id="navUserName">Loading...</div>
        <div style="font-size: 12px; color: #94a3b8;">Teacher</div>
      </div>
    </div>
  </header>

  <!-- LAYOUT -->
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">Teacher Panel</div>
      <div class="nav-links">
        <a href="/teacher/dashboard.html">Dashboard</a>
        <a href="/teacher/students.html">Students</a>
        <a href="/teacher/lessons.html">Lessons</a>
        <a href="/teacher/quizzes.html" class="active">Quizzes</a>
        <a href="/teacher/progress.html">Progress</a>
        <a href="/teacher/analytics.html">Analytics</a>
        <a href="/teacher/dictionary.html">Grammar Dictionary</a>
        <a href="/teacher/settings.html">Settings</a>
        <a href="#" class="logout-btn" id="logoutBtn">Log Out</a>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>Create New Quiz</h1>
      </div>

      <div class="form-card">
        <a href="/teacher/quizzes.html" class="back-link">← Back to Quizzes</a>
        
        <h2>Create Final Quiz</h2>
        <p>Select a lesson and choose the type of quiz.</p>

        <form id="quizForm">
          <div class="form-group">
            <label>Select Lesson</label>
            <select id="lesson_id" required>
              <option value="">Loading...</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Quiz Type</label>
            <select id="quiz_type" required>
              <option value="preposition">Preposition (Multiple Choice)</option>
              <option value="irregular_verb">Irregular Verb (Fill in blanks)</option>
              <option value="clause">Clause (Two-step)</option>
              <option value="sva">Subject-Verb Agreement</option>
              <option value="phrasal_verb">Phrasal Verb</option>
              <option value="sentence_pattern">Sentence Pattern</option>
            </select>
          </div>

          <div class="form-group">
            <label>Quiz Title</label>
            <input type="text" id="title" required placeholder="e.g., Prepositions Final Exam">
          </div>

          <div class="form-grid">
            <div class="form-group" style="margin-bottom: 0;">
              <label>Passing Score (%)</label>
              <input type="number" id="passing_score" required min="1" max="100" value="70">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label>Time Limit (Mins)</label>
              <input type="number" id="time_limit" min="1" placeholder="e.g. 10" value="10">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label>Max Attempts</label>
              <input type="number" id="max_quiz_attempts" min="1" value="3">

            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label>Questions per Quiz</label>
              <input type="number" id="questions_per_quiz" required min="1" value="10">
          </div>

          <button type="submit" id="submitBtn" class="btn-submit">Create Quiz & Add Questions →</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/auth-check.js"></script>
  <script src="/js/header-profile.js"></script>
  <script src="/teacher/create-quiz.js"></script>
</body>
</html>
